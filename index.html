<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Сканер серийных номеров</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#11151a;color:#f0f3f5;padding:18px;max-width:560px;margin-inline:auto}
h1{font-size:23px;margin:6px 0 6px}p{color:#aab4be;font-size:14px;margin:0 0 18px}.card{background:#1c232b;border:1px solid #36414d;border-radius:14px;padding:15px;margin-bottom:15px}
label{display:block;margin:11px 0 5px;font-weight:600;font-size:13px;color:#d1dae1}input,select{width:100%;background:#11171d;border:1px solid #48535f;border-radius:10px;color:#fff;padding:12px;font-size:16px}
button{font:600 16px system-ui;border:0;border-radius:11px;padding:13px 16px;width:100%;cursor:pointer;background:#4a89d1;color:white;margin:5px 0}button.secondary{background:#34404c}#reader{overflow:hidden;border-radius:12px;background:#080b0f}#status{font-size:13px;color:#aab4be;min-height:18px;margin:8px 0}small{color:#aab4be;display:block;margin-top:8px}
</style></head><body>
<h1>📷 IT Inventory</h1><p>Сканирование заводских серийных номеров</p>
<div class="card"><div id="reader"></div><button id="start">Запустить камеру</button><button id="stop" class="secondary" hidden>Остановить камеру</button><div id="status">Разреши доступ к камере при запросе.</div><small>Убедись, что распознан именно серийный номер (S/N), а не код модели или товара.</small></div>
<div class="card"><label for="serial">Серийный номер *</label><input id="serial" placeholder="Сканируй или введи вручную" maxlength="100" autocomplete="off" required>
<label for="type">Тип оборудования</label><select id="type"><option>ПК</option><option>Монитор</option><option>Ноутбук</option><option>Телефон</option><option>Принтер / МФУ</option><option>Сетевое оборудование</option><option>Другое</option></select>
<label for="brand">Производитель *</label><select id="brand"><option value="DELL">DELL</option><option value="HP">HP</option><option value="LENOVO">LENOVO</option><option value="ACER">ACER</option><option value="ASUS">ASUS</option></select>
<label for="model">Модель (необязательно)</label><input id="model" placeholder="Например, Latitude 5420" maxlength="100">
<label for="room">Кабинет</label><input id="room" placeholder="Например, 305" maxlength="50">
<button id="save">✅ Сохранить в общий журнал</button><small>После сохранения бот пришлёт подтверждение. Для следующего устройства открой сканер снова.</small></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
let qr=null,running=false; const el=id=>document.getElementById(id); const status=s=>el('status').textContent=s;
async function stop(){if(qr&&running){try{await qr.stop()}catch(e){}running=false}el('start').hidden=false;el('stop').hidden=true}
async function start(){if(!window.Html5Qrcode){status('Библиотека сканера не загрузилась. Проверь интернет.');return}
try{qr=qr||new Html5Qrcode('reader');await qr.start({facingMode:'environment'}, {fps:10,qrbox:{width:250,height:250}}, async text=>{el('serial').value=text;status('Считано: '+text+'. Проверь правильность серийника.');await stop()});running=true;el('start').hidden=true;el('stop').hidden=false;status('Наведи камеру на заводской штрихкод.')}
catch(e){status('Не удалось открыть камеру: '+e.message+'. Можно ввести серийник вручную.')}}
el('start').onclick=start;el('stop').onclick=stop;
el('save').onclick=async()=>{const serial=el('serial').value.trim();if(serial.length<3){alert('Укажи серийный номер (минимум 3 символа)');return}
if(!tg||typeof tg.sendData!=='function'){alert('Открой сканер через кнопку в личном чате с Telegram-ботом.');return}
await stop();const brand=el('brand').value;const modelDetail=el('model').value.trim();const model=(brand+' '+modelDetail).trim();const data=JSON.stringify({action:'add_asset',serial,type:el('type').value,model,room:el('room').value.trim()});tg.sendData(data)};
</script></body></html>
