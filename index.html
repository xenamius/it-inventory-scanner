
<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>IT Inventory — Scanner</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
:root {
  color-scheme: dark;
  font-family: system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0 auto;
  background: #11151a;
  color: #f0f3f5;
  padding: 18px;
  max-width: 560px;
}

h1 { font-size: 23px; margin: 6px 0; }

p {
  color: #aab4be;
  font-size: 14px;
  margin: 0 0 18px;
}

.card {
  background: #1c232b;
  border: 1px solid #36414d;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 15px;
}

label {
  display: block;
  margin: 11px 0 5px;
  font-size: 13px;
  font-weight: 600;
  color: #d1dae1;
}

input, select, textarea {
  width: 100%;
  background: #11171d;
  border: 1px solid #48535f;
  border-radius: 10px;
  color: white;
  padding: 12px;
  font-size: 16px;
}

textarea {
  resize: vertical;
  min-height: 72px;
}

button {
  width: 100%;
  padding: 13px 16px;
  margin: 5px 0;
  border: 0;
  border-radius: 11px;
  background: #4a89d1;
  color: white;
  font: 600 16px system-ui;
  cursor: pointer;
}

button.secondary { background: #34404c; }
button:disabled { opacity: .5; }

#reader {
  background: #080b0f;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
}

#reader.scan-success {
  outline: 4px solid #ffcc00;
  outline-offset: -4px;
  box-shadow: 0 0 22px rgba(255,204,0,.55);
}

#scan-indicator {
  display: none;
  background: #ffcc00;
  color: #111;
  font-weight: 700;
  text-align: center;
  border-radius: 10px;
  padding: 10px;
  margin-top: 10px;
}

#scan-indicator.visible { display: block; }

.modes {
  display: flex;
  gap: 8px;
  margin: 12px 0;
}

.modes button {
  flex: 1;
  font-size: 14px;
  background: #34404c;
}

.modes button.active {
  background: #eabf31;
  color: #111;
}

#status {
  font-size: 13px;
  color: #aab4be;
  min-height: 18px;
  margin: 8px 0;
}

small {
  color: #aab4be;
  display: block;
  margin-top: 8px;
}

#result-panel {
  border: 1px solid #526e87;
  background: #16232e;
  border-radius: 12px;
  padding: 12px;
  margin-top: 12px;
}

#format { color: #9bc6ff; font-weight: 700; }
#warn { color: #f9cb84; font-size: 13px; margin-top: 8px; }
</style>
</head>

<body>
<h1>📷 IT Inventory</h1>
<p>Сканер оборудования · QR и штрихкоды</p>

<div class="card">

  <div id="reader"></div>

  <div id="scan-indicator">
    ✓ Код распознан!
  </div>

  <div class="modes">
    <button id="mode-normal" class="active">
      Обычный
    </button>
    <button id="mode-aim">
      🎯 Прицел
    </button>
  </div>

  <button id="start">
    Запустить камеру
  </button>

  <button id="stop" class="secondary" hidden>
    Остановить камеру
  </button>

  <button id="torch" class="secondary" hidden disabled>
    🔦 Включить фонарик
  </button>

  <div id="status" role="status">
    Разреши доступ к камере.
  </div>

  <div id="result-panel" hidden>

    <div>
      Формат: <span id="format">—</span>
    </div>

    <label for="raw">Считанные данные</label>
    <textarea id="raw" readonly></textarea>

    <div id="warn"></div>

    <button id="apply">
      Использовать как серийный номер
    </button>

    <button id="rescan" class="secondary">
      Сканировать заново
    </button>

  </div>

  <small>
    В режиме «Прицел» помести нужный код
    целиком в центральную область.
    В обычном режиме сканируется весь кадр.
  </small>

</div>

<div class="card">

  <label for="serial">Серийный номер *</label>
  <input id="serial"
         maxlength="100"
         placeholder="Сканируй или введи вручную">

  <label for="type">Тип оборудования</label>
  <select id="type">
    <option>ПК</option>
    <option>Монитор</option>
    <option>Ноутбук</option>
    <option>Телефон</option>
    <option>Принтер / МФУ</option>
    <option>Сетевое оборудование</option>
    <option>Другое</option>
  </select>

  <label for="brand">Производитель *</label>
  <select id="brand">
    <option>DELL</option>
    <option>HP</option>
    <option>LENOVO</option>
    <option>ACER</option>
    <option>ASUS</option>
  </select>

  <label for="model">Модель</label>
  <input id="model"
         maxlength="100"
         placeholder="Например, Latitude 5420">

  <label for="room">Кабинет</label>
  <input id="room"
         maxlength="50"
         placeholder="Например, 305">

  <button id="save">
    ✅ Сохранить в общий журнал
  </button>

</div>

<script>
'use strict';

const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const el = id => document.getElementById(id);
const setStatus = text => {
  el('status').textContent = text;
};

const delay = ms =>
  new Promise(resolve => setTimeout(resolve, ms));

let qr = null;
let running = false;
let busy = false;
let stopping = false;
let scanCompleted = false;
let torchEnabled = false;
let lastScan = null;
let mode = 'normal';
let scanSession = 0;

const formats = [
  'QR_CODE',
  'CODE_128',
  'CODE_39',
  'CODE_93',
  'DATA_MATRIX'
];

/* -----------------------------
   ИНДИКАТОР РАСПОЗНАВАНИЯ
----------------------------- */

function showIndicator() {
  el('reader').classList.add('scan-success');
  el('scan-indicator').classList.add('visible');
}

function hideIndicator() {
  el('reader').classList.remove('scan-success');
  el('scan-indicator').classList.remove('visible');
}

/* -----------------------------
   РЕЖИМЫ СКАНИРОВАНИЯ
----------------------------- */

function updateModeButtons() {
  el('mode-normal').classList.toggle(
    'active', mode === 'normal'
  );

  el('mode-aim').classList.toggle(
    'active', mode === 'aim'
  );

  el('mode-normal').disabled = busy;
  el('mode-aim').disabled = busy;
}

async function changeMode(newMode) {
  if (busy || mode === newMode) return;

  const wasRunning = running;

  busy = true;
  updateModeButtons();

  try {
    if (wasRunning) {
      await stopCamera();
    }

    mode = newMode;
    hideIndicator();

  } finally {
    busy = false;
    updateModeButtons();
  }

  if (wasRunning) {
    await startCamera();
  } else {
    setStatus(
      mode === 'aim'
        ? 'Режим «Прицел» выбран.'
        : 'Обычный режим выбран.'
    );
  }
}

el('mode-normal').onclick = () =>
  changeMode('normal');

el('mode-aim').onclick = () =>
  changeMode('aim');

/* -----------------------------
   ОБЛАСТЬ ПРИЦЕЛА
----------------------------- */

function aimBox(width, height) {
  const minSide = Math.min(width, height);

  // Прицел занимает 65% короткой стороны.
  const side = Math.max(
    50,
    Math.floor(minSide * 0.65)
  );

  return {
    width: Math.min(side, width - 2),
    height: Math.min(side, height - 2)
  };
}

/* -----------------------------
   УПРАВЛЕНИЕ ФОНАРИКОМ
----------------------------- */

function updateTorch() {
  el('torch').textContent = torchEnabled
    ? '🔦 Выключить фонарик'
    : '🔦 Включить фонарик';
}

function showTorchButton() {
  // Не скрываем кнопку по capabilities:
  // на iPhone Telegram фонарик уже работает.
  el('torch').hidden = false;
  el('torch').disabled = false;
}

function resetTorch() {
  torchEnabled = false;
  el('torch').hidden = true;
  el('torch').disabled = true;
  updateTorch();
}

el('torch').onclick = async () => {
  if (!qr || !running || stopping || busy) return;

  const button = el('torch');
  const next = !torchEnabled;

  button.disabled = true;

  try {
    await qr.applyVideoConstraints({
      advanced: [{ torch: next }]
    });

    torchEnabled = next;
    updateTorch();

  } catch (e) {
    setStatus(
      'Не удалось переключить фонарик: ' +
      String(e?.message || e)
    );

  } finally {
    button.disabled = false;
  }
};

/* -----------------------------
   КНОПКИ КАМЕРЫ
----------------------------- */

function updateCameraButtons() {
  el('start').hidden = running;
  el('stop').hidden = !running;
}

/* -----------------------------
   ОСТАНОВКА КАМЕРЫ
----------------------------- */

async function stopCamera() {
  if (!qr || !running || stopping) return;

  stopping = true;

  // Старые события распознавания игнорируем.
  scanSession++;

  try {
    await qr.stop();
  } catch (e) {
    console.warn('Camera stop:', e);
  } finally {
    running = false;
    stopping = false;

    resetTorch();
    updateCameraButtons();
  }
}

/* -----------------------------
   РЕЗУЛЬТАТ
----------------------------- */

function showResult(text, result) {
  const format =
    result?.result?.format?.formatName ||
    'Не определён';


  const rawText = String(text);
  
  // Убираем только подтверждённый
  // служебный префикс GS1-128.
  const cleanText = rawText.startsWith(']C1')
    ? rawText.slice(3)
    : rawText;
  
  lastScan = {
    text: cleanText,
    rawText,
    format
  };


  el('format').textContent = format;
  el('raw').value = lastScan.rawText;

  el('result-panel').hidden = false;

  const s = lastScan.text;

  const suspicious =
    /[\r\n\t\x00-\x1F]/.test(s) ||
    s.length > 100 ||
    /https?:\/\//i.test(s);

  el('warn').textContent = suspicious
    ? '⚠️ Код содержит дополнительные данные. Проверь серийник.'
    : 'Проверь, что это серийный номер.';

  el('apply').disabled =
    s.length < 3 || s.length > 100;

  setStatus(
    'Код считан. Формат: ' + format
  );
}

/* -----------------------------
   ЗАПУСК КАМЕРЫ
----------------------------- */

async function startCamera() {
  if (busy || running || stopping) return;

  if (!window.Html5Qrcode) {
    setStatus('Библиотека сканирования не загрузилась.');
    return;
  }

  busy = true;
  scanCompleted = false;
  lastScan = null;

  const session = ++scanSession;

  el('start').disabled = true;
  el('result-panel').hidden = true;

  hideIndicator();
  updateModeButtons();

  try {
    if (!qr) {
      const enabledFormats = formats
        .map(name =>
          window.Html5QrcodeSupportedFormats?.[name]
        )
        .filter(value => value !== undefined);

      qr = new Html5Qrcode('reader', {
        formatsToSupport: enabledFormats,

        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true
        }
      });
    }

    const settings = {
      fps: 15,
      disableFlip: true,

      videoConstraints: {
        facingMode: 'environment',
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    };

    // Прицел ограничивает реальную область
    // декодирования, а не только рисует рамку.
    if (mode === 'aim') {
      settings.qrbox = aimBox;
    }

    await qr.start(
      { facingMode: 'environment' },
      settings,

      (text, result) => {
        if (
          session !== scanSession ||
          scanCompleted
        ) return;

        scanCompleted = true;
        showIndicator();
        showResult(text, result);

        try {
          navigator.vibrate?.(100);
        } catch (e) {}

        (async () => {
          await delay(700);

          if (session !== scanSession) return;

          await stopCamera();
          hideIndicator();
        })();
      }
    );

    running = true;
    updateCameraButtons();
    showTorchButton();

    // Автофокус, если поддерживается.
    try {
      const caps =
        qr.getRunningTrackCapabilities();

      if (caps.focusMode?.includes('continuous')) {
        await qr.applyVideoConstraints({
          advanced: [{ focusMode: 'continuous' }]
        });
      }
    } catch (e) {
      console.log('Автофокус:', e);
    }

    if (!scanCompleted) {
      setStatus(
        mode === 'aim'
          ? '🎯 Наведи нужный код внутрь прицела.'
          : 'Поиск кодов по всему кадру.'
      );
    }

  } catch (e) {
    setStatus(
      'Ошибка запуска камеры: ' +
      String(e?.message || e)
    );

  } finally {
    busy = false;
    el('start').disabled = false;
    updateModeButtons();
  }
}

/* -----------------------------
   КНОПКИ
----------------------------- */

el('start').onclick = startCamera;

el('stop').onclick = async () => {
  await stopCamera();
  hideIndicator();
  setStatus('Камера остановлена.');
};

el('rescan').onclick = async () => {
  if (busy) return;

  await stopCamera();
  hideIndicator();
  await startCamera();
};

el('apply').onclick = () => {
  if (!lastScan) return;

  const s = lastScan.text;

  if (s.length < 3 || s.length > 100) {
    alert('Проверь длину серийного номера.');
    return;
  }

  el('serial').value = s;
  el('result-panel').hidden = true;

  setStatus('Серийный номер перенесён.');
  el('serial').focus();
};

/* -----------------------------
   ОТПРАВКА В TELEGRAM
----------------------------- */

el('save').onclick = async () => {
  const serial = el('serial').value.trim();

  if (serial.length < 3) {
    alert('Укажи серийный номер.');
    return;
  }

  if (!tg || typeof tg.sendData !== 'function') {
    alert('Открой сканер через Telegram-бота.');
    return;
  }

  await stopCamera();

  const brand = el('brand').value;
  const modelDetail = el('model').value.trim();

  const model = (
    brand + ' ' + modelDetail
  ).trim();

  tg.sendData(JSON.stringify({
    action: 'add_asset',
    serial,
    type: el('type').value,
    model,
    room: el('room').value.trim()
  }));
};

</script>
</body>
</html>
